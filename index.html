<!DOCTYPE html>
<html>
<head>
    <title>HBW</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

    <h1>HUMAN BUG WIRE</h1>

    <div>
        <button onclick="showSection('login')">Login</button>
        <button onclick="showSection('signup')">Signup</button>
        <button onclick="loadCourses()">Courses</button>
        <button onclick="loadMyCourses()">My Courses</button>
        <button onclick="loadPayments()">Payments</button>
    </div>

</nav>


<!-- LOGIN -->

<section id="login">

    <h2>Login</h2>

    <input type="text" id="loginUsername" placeholder="Username">

    <input type="password" id="loginPassword" placeholder="Password">

    <button onclick="login()">Login</button>

</section>


<!-- SIGNUP -->

<section id="signup">

    <h2>Signup</h2>

    <input type="text" id="name" placeholder="Name">

    <input type="email" id="email" placeholder="Email">

    <input type="text" id="phone" placeholder="Phone">

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="signup()">Signup</button>

</section>


<!-- COURSES -->

<section id="courses">

    <h2>Courses</h2>

    <div id="courseContainer"></div>

</section>


<!-- MY COURSES -->

<section id="mycourses">

    <h2>My Courses</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Course</th>
                <th>Mode</th>
            </tr>
        </thead>

        <tbody id="myCourseBody"></tbody>

    </table>

</section>


<!-- PAYMENTS -->

<section id="payments">

    <h2>Payment History</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Course</th>
                <th>Amount</th>
                <th>Payment</th>
            </tr>
        </thead>

        <tbody id="paymentBody"></tbody>

    </table>

</section>


<script src="app.js"></script>

</body>
</html>

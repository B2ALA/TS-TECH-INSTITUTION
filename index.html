
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Tech Park – LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--primary:#1a1a2e;--accent:#e94560;--accent2:#0f3460;--accent3:#16213e;--gold:#f5a623;--teal:#00b4d8;--green:#06d6a0;--purple:#7c3aed;--bg:#f8fafc;--bg2:#ffffff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,0.08);--radius:14px}
[data-theme="dark"]{--bg:#0f0f1a;--bg2:#1a1a2e;--text:#f1f5f9;--text2:#94a3b8;--border:#2d3748;--shadow:0 4px 24px rgba(0,0,0,0.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Sora',sans-serif}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:white;font-family:'Sora',sans-serif}
.logo-text{color:white;font-size:18px;font-weight:700;line-height:1.1}
.logo-sub{color:#94a3b8;font-size:10px;font-weight:400;display:block}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:#cbd5e1;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all .2s;cursor:pointer;border:none;background:none}
.nav-link:hover,.nav-link.active{color:white;background:rgba(255,255,255,0.1)}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-sm{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,0.3);color:white}
.btn-outline:hover{background:rgba(255,255,255,0.1)}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#c73a52}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.1);border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.theme-toggle:hover{background:rgba(255,255,255,0.2)}
.notif-btn{position:relative;width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.1);border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.notif-badge{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--accent);border-radius:50%;border:1.5px solid var(--primary)}
.user-avatar-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;color:white;cursor:pointer;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center}
.page{display:none;padding-top:64px;min-height:100vh}
.page.active{display:block}
.hero{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);min-height:calc(100vh - 64px);display:flex;align-items:center;position:relative;overflow:hidden;padding:4rem 2rem}
.hero-content{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;width:100%;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(233,69,96,0.15);border:1px solid rgba(233,69,96,0.3);color:var(--accent);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:1.5rem}
.hero h1{font-size:3.2rem;font-weight:800;color:white;line-height:1.15;margin-bottom:1.2rem}
.hero h1 span{color:var(--accent)}
.hero p{color:#94a3b8;font-size:1.05rem;line-height:1.7;margin-bottom:2rem}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.btn-hero{padding:14px 28px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .25s;font-family:'Inter',sans-serif}
.btn-hero-primary{background:var(--accent);color:white;box-shadow:0 8px 24px rgba(233,69,96,0.4)}
.btn-hero-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(233,69,96,0.5)}
.btn-hero-secondary{background:rgba(255,255,255,0.08);color:white;border:1.5px solid rgba(255,255,255,0.2)}
.btn-hero-secondary:hover{background:rgba(255,255,255,0.14)}
.hero-stats{display:flex;gap:2rem;margin-top:2.5rem}
.stat-num{font-size:1.8rem;font-weight:800;color:white;font-family:'Sora',sans-serif}
.stat-label{font-size:12px;color:#94a3b8;margin-top:2px}
.hero-visual{display:flex;flex-direction:column;gap:14px}
.course-preview-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;backdrop-filter:blur(10px)}
.cpc-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cpc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.cpc-icon.emb{background:linear-gradient(135deg,#0891b2,#0e7490)}
.cpc-icon.ai{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.cpc-title{color:white;font-weight:600;font-size:15px}
.cpc-cat{color:#64748b;font-size:12px}
.progress-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--purple))}
.cpc-meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b}
.ai-chat-preview{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px}
.acp-title{color:#94a3b8;font-size:12px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:8px;max-width:85%}
.chat-bubble.bot{background:rgba(124,58,237,0.2);color:#c4b5fd;border-radius:12px 12px 12px 2px}
.chat-bubble.user{background:rgba(233,69,96,0.2);color:#fca5a5;margin-left:auto;border-radius:12px 12px 2px 12px}
.section{padding:5rem 2rem}
.section-inner{max-width:1200px;margin:0 auto}
.section-label{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.section-title{font-size:2.2rem;font-weight:800;margin-bottom:1rem}
.section-sub{color:var(--text2);font-size:1rem;line-height:1.7;max-width:560px}
.page-header{background:var(--primary);padding:3rem 2rem 2rem}
.page-header-inner{max-width:1200px;margin:0 auto}
.page-header h2{color:white;font-size:2rem;font-weight:800}
.page-header p{color:#94a3b8;font-size:.95rem;margin-top:6px}
.filters-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;position:sticky;top:64px;z-index:100}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-box{position:relative;flex:1;min-width:220px}
.search-box input{width:100%;padding:9px 14px 9px 38px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px}
.filter-select{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.filter-tag{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);transition:all .2s}
.filter-tag.active,.filter-tag:hover{border-color:var(--accent);background:rgba(233,69,96,0.08);color:var(--accent)}
.courses-grid{max-width:1200px;margin:2rem auto;padding:0 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.course-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s;cursor:pointer}
.course-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:transparent}
.cc-thumb{height:160px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.cc-badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.badge-new{background:var(--green);color:#0d3b2e}
.badge-hot{background:var(--accent);color:white}
.badge-free{background:var(--gold);color:#4a2e00}
.cc-body{padding:18px}
.cc-cat{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.cc-title{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.4}
.cc-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.cc-meta{display:flex;gap:12px;font-size:12px;color:var(--text2);margin-bottom:14px}
.cc-meta i{color:var(--accent)}
.cc-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border)}
.cc-price{font-size:18px;font-weight:800;color:var(--text)}
.old-price{font-size:13px;color:var(--text2);text-decoration:line-through;font-weight:400;margin-left:6px}
.stars{color:var(--gold);font-size:12px}
.btn-enroll{padding:8px 18px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-enroll:hover{background:#c73a52}
.wishlist-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.wishlist-btn:hover,.wishlist-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(233,69,96,0.08)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:2000;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border-radius:20px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{padding:24px 28px 0;display:flex;align-items:flex-start;justify-content:space-between}
.modal-close{width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-body{padding:24px 28px 28px}
.course-modal-thumb{height:220px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:5rem;margin-bottom:24px;position:relative}
.play-btn{position:absolute;width:60px;height:60px;background:rgba(255,255,255,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--primary);cursor:pointer;transition:transform .2s}
.play-btn:hover{transform:scale(1.1)}
.modal-title{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.modal-desc{color:var(--text2);line-height:1.7;font-size:14px;margin-bottom:20px}
.modal-tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px}
.modal-tab{padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.curriculum-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.curriculum-item i{color:var(--accent);width:20px}
.auth-modal{max-width:440px}
.auth-tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:9px;border:none;background:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .2s}
.auth-tab.active{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text)}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s;font-family:'Inter',sans-serif}
.form-input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-full{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s}
.btn-accent{background:var(--accent);color:white}
.btn-accent:hover{background:#c73a52;transform:translateY(-1px)}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--text2);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.social-btn{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;transition:all .2s;font-family:'Inter',sans-serif}
.social-btn:hover{border-color:var(--accent);background:rgba(233,69,96,0.04)}
.forgot-link{text-align:right;margin-top:-10px;margin-bottom:16px}
.forgot-link a{color:var(--accent);font-size:13px;text-decoration:none}
.role-select{display:flex;gap:10px;margin-bottom:16px}
.role-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.role-btn.active{border-color:var(--accent);background:rgba(233,69,96,0.08);color:var(--accent)}
.dashboard-layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:1.5rem 1rem;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.sidebar-section{margin-bottom:2rem}
.sidebar-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;padding:0 12px;margin-bottom:8px}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;border:none;background:none;width:100%;text-align:left}
.sidebar-link i{width:20px;font-size:16px}
.sidebar-link:hover{background:var(--bg);color:var(--text)}
.sidebar-link.active{background:rgba(233,69,96,0.1);color:var(--accent)}
.sidebar-link .badge{margin-left:auto;background:var(--accent);color:white;padding:2px 8px;border-radius:10px;font-size:11px}
.dash-main{padding:2rem;overflow-y:auto}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.dash-header h2{font-size:1.6rem;font-weight:800}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:2rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-card.accent1{background:linear-gradient(135deg,#e94560,#c73a52);border-color:transparent;color:white}
.stat-card.accent2{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:transparent;color:white}
.stat-card.accent3{background:linear-gradient(135deg,#0891b2,#0e7490);border-color:transparent;color:white}
.stat-card.accent4{background:linear-gradient(135deg,#059669,#047857);border-color:transparent;color:white}
.stat-icon{font-size:22px;margin-bottom:12px;opacity:.9}
.stat-value{font-size:2rem;font-weight:800;font-family:'Sora',sans-serif}
.stat-label-small{font-size:13px;opacity:.85;margin-top:4px}
.stat-change{font-size:12px;margin-top:8px;opacity:.8}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:2rem}
.dash-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.dash-card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.dash-card-title a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:500}
.enrolled-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.enrolled-item:last-child{border-bottom:none}
.ei-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.ei-info{flex:1;min-width:0}
.ei-name{font-size:14px;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei-progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.mini-progress{flex:1;height:5px;background:var(--border);border-radius:3px}
.mini-fill{height:100%;border-radius:3px;background:var(--accent)}
.btn-resume{padding:6px 14px;background:var(--accent);color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ad-blue{background:rgba(8,145,178,0.12);color:#0891b2}
.ad-green{background:rgba(5,150,105,0.12);color:#059669}
.ad-purple{background:rgba(124,58,237,0.12);color:#7c3aed}
.ad-red{background:rgba(233,69,96,0.12);color:var(--accent)}
.ad-gold{background:rgba(245,166,35,0.12);color:var(--gold)}
.leaderboard-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.lb-rank{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.lb-rank.gold{background:#fef3c7;color:#92400e}
.lb-rank.silver{background:#f1f5f9;color:#475569}
.lb-rank.bronze{background:#fed7aa;color:#92400e}
.lb-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.lb-name{flex:1;font-size:14px;font-weight:600}
.lb-points{font-size:13px;font-weight:700;color:var(--accent)}
.chatbot-widget{position:fixed;bottom:24px;right:24px;z-index:1500}
.chatbot-toggle{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;cursor:pointer;box-shadow:0 8px 24px rgba(233,69,96,0.4);display:flex;align-items:center;justify-content:center;font-size:22px;color:white;transition:all .3s}
.chatbot-toggle:hover{transform:scale(1.08)}
.chatbot-panel{position:absolute;bottom:70px;right:0;width:370px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.2);display:none;flex-direction:column;overflow:hidden}
.chatbot-panel.open{display:flex}
.chat-header{background:linear-gradient(135deg,var(--primary),var(--accent2));padding:16px 18px;display:flex;align-items:center;gap:12px}
.chat-ai-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;color:white;flex-shrink:0}
.chat-ai-name{color:white;font-weight:700;font-size:15px}
.chat-ai-status{color:rgba(255,255,255,0.6);font-size:12px}
